site_name: 'PixelVirt'
site_url: https://docs.pixelvirt.com
theme:
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - announce.dismiss
    - header.autohide
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    # - navigation.instant.preview
    - navigation.prune
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  copyright: Copyright &copy; 2024 Pixelvirt Technology Pvt Ltd

extra_css:
  - assets/stylesheets/empty.css
  - assets/stylesheets/glightbox.min.css

extra_javascript:
  - assets/javascripts/glightbox.min.js
  - assets/javascripts/lightbox.js

nav:
  - Welcome: index.md
  - PixelView Documentation:
    - PixelView:
      - Introduction: pixelview/introduction.md
    - Installations:
      - Install on Docker: pixelview/installation/install-on-docker.md
      - HA Setup: pixelview/installation/install-ha.md
    - Clouds:
      - Openstack: pixelview/clouds/openstack.md
      - Kubernetes: pixelview/clouds/kubernetes.md
      - VMware: pixelview/clouds/vmware.md
    - Cases: 
      - Cases Overview: pixelview/cases/cases.md
    - Services/Monitoring:
      - Services Overview: pixelview/services/services.md
      # - Zabbix Integration:
      #   - Setup on Docker: pixelview/services/zabbix/integration.md
      - Prometheus Integration:
        - Setup AlertManager: pixelview/services/prometheus/integration.md
    - Escalation:
      - Escalation Policies: pixelview/escalation/policies.md
    - Automation:
      - Automation Overview: pixelview/automation/automation.md
      - Executions: pixelview/automation/executions.md
      - Playbooks: pixelview/automation/playbooks.md
      - Rules: pixelview/automation/rules.md
      - Automation Bots: pixelview/management/bots.md
      # - Automation Workflows: ""
    - Inventory:
      - Cloud Inventory: pixelview/inventory/inventory.md
      - Credentials Management: pixelview/inventory/creds.md
      - Host Groups: pixelview/inventory/host-groups.md
    - Patch Management:
      - Patch Management Overview: pixelview/patch-management/patch-management.md
      - Patchset Management: pixelview/patch-management/patchset.md
      - Planner Management: pixelview/patch-management/planner.md
    - Management and Settings:
      - User Management: pixelview/management/user-management.md
      - Settings: pixelview/settings/settings.md
      - Login: pixelview/settings/login.md
      - SSO Integration: pixelview/management/sso-integration.md
  - PixelView API:
    - "API Examples": pixelview/api/api.md
    - "Python Example": pixelview/api/create-alerts.md

  - Blogs:
    - Blog: 
      - https://blog.pixelvirt.com
#  - openstack:
#    - 'Initial setup': openstack/quick-guide.md
#    - 'Launching an Instance ': openstack/lunch-instance.md
#    - 'key pair': openstack/key-pair.md
#    - 'Accessing an OpenStack instance': openstack/instance-access.md
#    - 'Image Creation': openstack/image-creation.md
#    - 'Openstack Networks': openstack/network-creation.md
#    - ' quota and organization request': openstack/quota-org-request.md
#    - 'Organization Registration': openstack/org-registration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  # - pymdownx.blocks.caption

plugins:
  - blog:
      post_slugify_separator: _
      categories_name: Categories
      categories_url_format: "category/{slug}"
      # authors_profiles_pagination: false
      # authors_profiles: true
      categories: true
      categories_toc: true
  - exclude:
      glob:
        - pixelview/cases/incident_documentation.md
        - pixelview/management/custom-bot.md
        - pixelview/management/registration.md
        - pixelview/settings/config.md